# ==============================================================================
# EarthMind AI — Docker Compose Infrastructure Configuration
# ==============================================================================
#
# This compose file spins up the supporting database and cache services
# along with the backend and frontend applications.
#
# Usage
# -----
#   1. Start services in the background:
#      $ docker compose up -d
#
#   2. Check service status:
#      $ docker compose ps
#
#   3. Stop services:
#      $ docker compose down
#
# Services Included
# -----------------
#   - PostgreSQL (port 5432) : Relational database storing query history and metadata.
#   - Redis (port 6379)      : High-performance caching layer.
#   - Backend (port 8000)    : FastAPI server running LangGraph multi-agent system.
#   - Frontend (port 3000)   : TanStack Start / Vite React client application.
#
# Persistent Volumes
# ------------------
#   - pgdata      : Retains PostgreSQL database records.
#   - redisdata   : Retains Redis cache state.
#   - backenddata : Retains backend runtime data (vector store and uploads).
#
# LLM
# ---
#   LLM inference is handled by Groq (https://groq.com).
#   Set GROQ_API_KEY in your environment or .env file.
#
# ==============================================================================

services:

  # ── PostgreSQL Relational Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: earthmind-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: earthmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d earthmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache Layer ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: earthmind-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── EarthMind AI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: earthmind-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/earthmind
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-oss-20b}
      - TEMPERATURE=${TEMPERATURE:-0}
      - ENV=development
      - DEBUG=True
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - backenddata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── EarthMind AI Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: earthmind-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  backenddata:
    driver: local
